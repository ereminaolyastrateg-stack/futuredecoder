<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now and wanted</title>
<meta name="description" content="An anonymous questionnaire on life spheres: pick spheres, mark what you have and what you want, and build your image of the future. Answers never leave your device.">
<link rel="canonical" href="https://futuredecoder.org/static/opros/en/">
<link rel="alternate" hreflang="ru" href="https://futuredecoder.org/static/opros/">

<meta property="og:title" content="Now and wanted — Future Decoder">

<meta property="og:url" content="https://futuredecoder.org/static/opros/en/">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeeea; --surface:#fff; --ink:#191818; --muted:#5f5d58; --line:#d9d6ce;
  --cs:#fc5721; --cz:#fedf3a; --ds:#1e7ff0; --dz:#fd7fb8; --link:#068ee6;
  --want:#1e7ff0; --no:#8a877f; --keep:#2f9e6a; --drop:#fc5721;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --holo:linear-gradient(115deg,#f2d36b 0%,#f08a4b 18%,#e9508e 34%,#7a5cf0 50%,#2fa7e8 66%,#5fd3a0 82%,#f2d36b 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 20px 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--ink);padding:7px 16px;border:1px solid var(--ink);border-radius:999px;font-size:14px;font-weight:500;background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:#fff}
nav.tabs a.langsw{font-weight:700;border-style:dashed}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,6vw,58px);line-height:1;margin:0 0 6px;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:28px;line-height:1.1;margin:0 0 12px}
h3{font-family:var(--display);font-weight:500;text-transform:uppercase;font-size:20px;margin:22px 0 8px}
.hand{font-family:var(--hand);font-size:26px;line-height:1.1;color:var(--muted)}
.holo{height:6px;border-radius:3px;background:var(--holo);margin:14px 0 22px}
.lead{font-size:18px;max-width:640px}
.muted{color:var(--muted)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted);margin:18px 0}
.note b{color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:18px 0}
.chip{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .box{flex:none;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:5px;margin-top:2px;display:grid;place-items:center;font-size:14px;font-weight:700}
.chip[aria-pressed="true"] .box{background:var(--ink);color:#fff}
.chip small{display:block;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
a.btn{display:inline-block;text-decoration:none}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 14px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:14px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .2s}
.crumb{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.q{font-size:18px;margin:6px 0 18px;max-width:700px}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.card[data-a="want"]{border-color:var(--want)}
.card[data-a="keep"]{border-color:var(--keep)}
.card[data-a="drop"]{border-color:var(--drop)}
.card[data-a="no"]{opacity:.7}
.card h4{margin:0 0 4px;font-size:17px}
.card .story{font-size:18px;font-weight:600;line-height:1.35;margin:0 0 6px}
.card .sig{font-size:13px;color:var(--muted);margin:0 0 10px}
.card p{margin:0 0 10px}
.more{font-size:14px;color:var(--muted);margin:0 0 10px}
.more summary{cursor:pointer;color:var(--ink);font-weight:500}
.more p{margin:6px 0}
.ans{display:flex;gap:6px;flex-wrap:wrap}
.ans button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.ans button[aria-pressed="true"][data-v="want"]{background:var(--want);border-color:var(--want);color:#fff}
.ans button[aria-pressed="true"][data-v="no"]{background:var(--no);border-color:var(--no);color:#fff}
.ans button[aria-pressed="true"][data-v="keep"]{background:var(--keep);border-color:var(--keep);color:#fff}
.ans button[aria-pressed="true"][data-v="drop"]{background:var(--drop);border-color:var(--drop);color:#fff}
.fields{display:grid;gap:8px;margin-top:12px}
.fields label{font-size:13px;color:var(--muted);font-weight:500}
textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfaf7;resize:vertical;min-height:44px}
.own{margin-top:16px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
@media (max-width:700px){.cols,.wcards{grid-template-columns:1fr}.wbar,.wh{grid-template-columns:110px 1fr 1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.col h2{font-size:24px}
.col .sp{font-weight:700;margin:14px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.col ul{margin:0;padding-left:18px}
.col li{margin:3px 0}
.col li small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.tag.keep{background:#e3f3ea;color:#1d6e48}.tag.drop{background:#ffe6dc;color:#b43b0c}.tag.want{background:#e1eeff;color:#0f58b0}
.drop-t{text-decoration:line-through;text-decoration-color:var(--drop)}
.worlds{margin-top:18px}
.verdict{font-size:19px;font-weight:600;line-height:1.4;margin:14px 0 6px}
.wcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 26px}
.wcard{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-size:14px;line-height:1.45}
.wcard h3{margin:0 0 2px;font-size:16px}
.wcard .cnt{font-size:12px;color:var(--muted);margin-bottom:8px}
.wcard p{margin:6px 0}
.wcard b{font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.steps span{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps span.done{color:var(--ink)}
.pick{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;line-height:1.4}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .box{flex:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:5px;margin-top:2px;display:grid;place-items:center;font-size:12px;font-weight:700}
.pick[aria-pressed="true"] .box{background:var(--ink);color:#fff}
.pick small{display:block;color:var(--muted);font-size:12px}
.item{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.item .t{font-weight:600;margin:0 0 8px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.tg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg.need{background:#fff3c4;border-color:#c9a400}
.tg.lack{background:#ffd9cc;border-color:var(--drop,#d9480f)}
.tg.have{background:#d8f1df;border-color:#2f9e44}
.item input[type=text],.item textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
.tg.big{font-size:15px;padding:8px 15px}
.tg.have[aria-pressed="true"]{background:#2f9e44;border-color:#2f9e44;color:#fff}
.way{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.way.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.way .t{margin:0;line-height:1.45}
.wos{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.wo{font-size:12px;padding:2px 9px;border-radius:999px;background:#f1f3f5;color:#495057}
.wo.hit{background:#d8f1df;color:#1b6e2e;font-weight:600}
.sumbox{border:1.5px solid var(--ink);border-radius:16px;padding:16px 18px;margin:20px 0}
.sumbox .big{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 10px}
.vbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:5px 0;font-size:14px}
.vbar .b{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.vbar .b i{display:block;height:100%}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.pair .z{font-size:22px}
.pair .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.why{font-size:14px;color:var(--muted);margin:6px 0}
@media (max-width:700px){.pair{grid-template-columns:1fr}.pair .z{text-align:center}.vbar{grid-template-columns:110px 1fr 30px}}
.labbox{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:26px 0 8px}
.labbox h2{margin-top:0}
.labbox ul{margin:8px 0 14px;padding-left:20px}
.wbar{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.wbar .b{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.wbar .b i{display:block;height:100%}
.wh{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.empty{color:var(--muted);font-style:italic}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
@media print{
  body{background:#fff}
  .top,.noprint,nav{display:none!important}
  .col{border:0;padding:0}
  .cols{grid-template-columns:1fr 1fr}
}
</style>
</head>

const WC = {"ЦС":"var(--cs)","ЦЗ":"var(--cz)","ДС":"var(--ds)","ДЗ":"var(--dz)"};
const LAB = "/en/work-with-me";
function plural(n,f){const a=n%10,b=n%100;return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const L = (o,k)=>o[k+"_"+LANG]||o[k+"_ru"]||"";
const nm = o=>o[LANG]||o.ru;
const vtitle = v=>v.s_ru?L(v,"s"):L(v,"n");

const LAB0=()=>({step:0,picks:[],vals:{},vown:{},clouds:{},def:null,first:null,gain:{}});
let D=null, S={sel:[],ans:{},own:{},order:{},pos:0,lab:LAB0()}, canStore=true;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){canStore=false}S.lab=Object.assign(LAB0(),S.lab||{})}
function save(){if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){canStore=false}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}S={sel:[],ans:{},own:{},order:{},pos:0,lab:LAB0()}}

function queue(){const q=[];for(const sp of D.spheres)if(S.sel.includes(sp.id))for(const sb of sp.subs)q.push({sp,sb});return q}
function order(sb){
  if(!S.order[sb.id]){const a=sb.v.map(v=>v.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.order[sb.id]=a}
  return S.order[sb.id].map(id=>sb.v.find(v=>v.id===id)).filter(Boolean);
}

function show(name){
  for(const n of ["start","run","result","lab"])document.getElementById("s-"+n).hidden=n!==name;
  document.querySelectorAll("nav.tabs a[data-s]").forEach(a=>a.dataset.s===name?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  ({start:rStart,run:rRun,result:rResult,lab:rLab})[name]();
  window.scrollTo(0,0);
}
function route(){const h=(location.hash||"#start").slice(1);show(["start","run","result","lab"].includes(h)?h:"start")}

function rStart(){
  const el=document.getElementById("s-start");
  const n=queue().length, answered=Object.keys(S.ans).length;
  el.innerHTML=`<h1>${T.h1}</h1><div class="hand">${T.hand}</div><div class="holo"></div>
  <p class="lead">${T.lead}</p><div class="note">${T.privacy}${canStore?"":"<br><br>"+T.noStore}</div>
  <h2>${T.pick}</h2>
  <div class="row"><button class="link" id="all">${T.all}</button><button class="link" id="none">${T.none}</button></div>
  <div class="chips">${D.spheres.map(sp=>`<button class="chip" data-id="${sp.id}" aria-pressed="${S.sel.includes(sp.id)}"><span class="box">${S.sel.includes(sp.id)?"✓":""}</span><span>${esc(nm(sp))}<small>${T.subs(sp.subs.length)}</small></span></button>`).join("")}</div>
  <div class="row"><button class="btn" id="go" ${n?"":"disabled"}>${answered?T.cont:T.go}</button><span class="muted">${n?T.time(Math.max(2,Math.round(n*1.5))):""}</span>
  ${answered?`<button class="link" id="re">${T.restart}</button>`:""}</div>`;
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const id=b.dataset.id;S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];save();rStart()});
  el.querySelector("#all").onclick=()=>{S.sel=D.spheres.map(s=>s.id);save();rStart()};
  el.querySelector("#none").onclick=()=>{S.sel=[];save();rStart()};
  el.querySelector("#go").onclick=()=>{S.pos=Math.min(S.pos,queue().length-1);save();location.hash="run"};
  const re=el.querySelector("#re");if(re)re.onclick=()=>sure(re,T.restart,()=>{const sel=S.sel;wipe();S.sel=sel;save();rStart()});
}

function fieldsFor(v,a){
  const r=S.ans[v.id]||{};
  const ta=(k,lab)=>`<label>${lab}<textarea data-v="${v.id}" data-k="${k}" rows="2">${esc(r[k]||"")}</textarea></label>`;
  if(a==="want")return ta("take",T.f_take)+ta("give",T.f_give);
  if(a==="no")return ta("why",T.f_why);
  if(a==="drop")return ta("why",T.f_dropwhy);
  if(a==="keep")return ta("why",T.f_keepwhy);
  return "";
}
function rRun(){
  const el=document.getElementById("s-run"), q=queue();
  if(!q.length){location.hash="start";return}
  S.pos=Math.max(0,Math.min(S.pos,q.length-1));
  const {sp,sb}=q[S.pos];
  el.innerHTML=`<div class="crumb">${esc(nm(sp))} · ${T.step} ${S.pos+1} ${T.of} ${q.length}</div>
  <div class="progress"><i style="width:${(S.pos+1)/q.length*100}%"></i></div>
  <h2>${esc(nm(sb))}</h2><p class="q">${esc(L(sb,"q"))}</p>
  <div class="cards">${order(sb).map(v=>{const a=(S.ans[v.id]||{}).a||"";
    const ex=v.ex.map(e=>`<p>${esc(e[LANG]||e.ru)}${e.src?` <a href="${esc(e.src)}" target="_blank" rel="noopener">${T.src}</a>`:""}</p>`).join("");
    const head=v.s_ru?`<p class="story">${esc(L(v,"s"))}</p><p class="sig">${T.sig} ${esc(L(v,"g"))} <a href="${esc(LANG==="en"?v.g_src_en:v.g_src)}" target="_blank" rel="noopener">${T.src}${v.g_date&&v.g_date!=="сад"?", "+esc(v.g_date):""}</a></p>`:`<h4>${esc(L(v,"n"))}</h4><p>${esc(L(v,"t"))}</p>`;
    return `<article class="card" data-id="${v.id}" data-a="${a}">${head}
    <details class="more"><summary>${T.more}</summary><p><b>${T.plus}</b> ${esc(L(v,"p"))}</p><p><b>${T.minus}</b> ${esc(L(v,"m"))}</p>${ex?`<p><b>${T.ex}</b></p>${ex}`:""}</details>

function collect(){
  const out=[];
  for(const sp of D.spheres){
    const subs=[];
    for(const sb of sp.subs){
      const items=sb.v.filter(v=>S.ans[v.id]).map(v=>({v,r:S.ans[v.id]}));
      if(items.length||S.own[sb.id])subs.push({sb,items,own:S.own[sb.id]||""});
    }
    if(subs.length)out.push({sp,subs});
  }
  return out;
}
function worldCounts(){
  const now={},fut={};for(const k in T.worlds){now[k]=0;fut[k]=0}
  for(const sp of D.spheres)for(const sb of sp.subs)for(const v of sb.v){const r=S.ans[v.id];if(!r)continue;
    if(r.a==="keep"||r.a==="drop")now[v.w]++;if(r.a==="keep"||r.a==="want")fut[v.w]++}
  return {now,fut};
}
function conclusion(){
  const {now,fut}=worldCounts(), ks=Object.keys(T.worlds);
  const top=o=>{const m=Math.max(...ks.map(k=>o[k]));return m?ks.filter(k=>o[k]===m):[]};
  const nm2=a=>a.map(k=>T.wPrep[k]).join(T.vAnd), gn2=a=>a.map(k=>T.wGen[k]).join(T.vAnd);
  const tn=top(now), tf=top(fut);
  let v="";
  if(!tn.length&&tf.length)v=T.vOnlyFut(gn2(tf));
  else if(tn.length&&tf.length&&tn.join()===tf.join())v=T.vSame(nm2(tn));
  else if(tn.length&&tf.length)v=T.vShift(nm2(tn),nm2(tf));
  const gains=ks.map(k=>fut[k]-now[k]), g=Math.max(...gains);
  if(v&&g>0&&tn.length){const gk=ks.filter((k,i)=>gains[i]===g&&!tf.includes(k));if(gk.length)v+=T.vGrow(gn2(gk))}
  const shown=ks.filter(k=>now[k]||fut[k]).sort((a,b)=>(fut[b]-now[b])-(fut[a]-now[a])||fut[b]-fut[a]);
  return {now,fut,v,shown};
}
function colHTML(data,filter,cls){

        const extra=[r.take,r.give,r.why].filter(Boolean).map(esc).join(" · ");
        const tag=cls==="now"?`<span class="tag ${r.a}">${r.a==="keep"?T.tagKeep:T.tagDrop}</span>`:(r.a==="want"?`<span class="tag want">${T.tagWant}</span>`:"");
        lines.push(`<li><span class="${cls==="now"&&r.a==="drop"?"drop-t":""}">${esc(vtitle(v))}</span>${tag}<small>${esc(nm(sb))}${extra?" — "+extra:""}</small></li>`)}
      if(own&&cls!=="no")lines.push(`<li><i>${esc(own)}</i><small>${esc(nm(sb))}</small></li>`);
    }
    if(lines.length)h+=`<div class="sp">${esc(nm(sp))}</div><ul>${lines.join("")}</ul>`;
  }
  return h||`<p class="empty">${T.emptyCol}</p>`;
}

function toMD(data){
  const {now,fut}=worldCounts();
  const sec=(title,filter)=>{let s=`\n## ${title}\n`;let any=false;
    for(const {sp,subs} of data){let part="";
      for(const {sb,items,own} of subs){for(const {v,r} of items){if(!filter.includes(r.a))continue;
        const bits=[];if(r.take)bits.push(T.mdTake+": "+r.take);if(r.give)bits.push(T.mdGive+": "+r.give);if(r.why)bits.push(T.mdWhy+": "+r.why);
        part+=`- **${vtitle(v)}** (${T.buttons[r.a]}; ${nm(sb)}; ${T.worlds[v.w]})${bits.length?"\n  - "+bits.join("\n  - "):""}\n`}}
      if(part){s+=`\n### ${nm(sp)}\n${part}`;any=true}}
    return any?s:"";};
  let own="";for(const {sp,subs} of data)for(const {sb,own:o} of subs)if(o)own+=`- ${nm(sp)} / ${nm(sb)}: ${o}\n`;
  return `---\ntitle: "${T.mdTitle}"\ndate: ${today()}\ntags: [${LANG==="ru"?"тип/опрос":"type/questionnaire"}]\nsource: https://futuredecoder.org/static/opros/${LANG==="en"?"en/":""}\n---\n\n# ${T.mdTitle}\n\n${T.mdSpheres}: ${data.map(x=>nm(x.sp)).join(", ")}\n`
   +(()=>{const C=conclusion();let s=`\n## ${T.mdConcl}\n\n${C.v}\n`;
      if(C.shown.length){s+=`\n### ${T.mdSteps}\n`;for(const k of C.shown){const t=T.wTxt[k];s+=`\n**${T.worlds[k]}** (${T.cnt(C.now[k],C.fut[k])})\n- ${T.lGive} ${t[0]}\n- ${T.lPay} ${t[1]}\n`+(C.fut[k]>C.now[k]?`- ${T.lPull} ${t[2]}\n- ${T.lStep} ${t[3]}\n`:C.fut[k]<C.now[k]?`- ${T.lLess} ${T.tLess}\n`:"")}}
      return s})()
   +sec(T.now,["keep","drop"])+sec(T.future,["want","keep"])+sec(T.rejected,["no"])
   +(own?`\n## ${T.own.replace(/ \(.*\)$/,"")}\n${own}`:"")+labMD()
   +`\n## ${T.mdWorlds}\n| ${T.wHead.join(" | ")} |\n|---|---|---|\n${Object.keys(T.worlds).map(k=>`| ${T.worlds[k]} | ${now[k]} | ${fut[k]} |`).join("\n")}\n`;
}

const TENS=[["svoboda","bezop"],["svoboda","blizost"],["svoboda","prinadl"],["novizna","pokoy"],["novizna","bezop"],["razvit","pokoy"],["priznan","pokoy"],["dostatok","pokoy"],["dostatok","smysl"]];
const DIAG={"ЦС":"ДЗ","ДЗ":"ЦС","ЦЗ":"ДС","ДС":"ЦЗ"};
function card(id){for(const sp of D.spheres)for(const sb of sp.subs)for(const v of sb.v)if(v.id===id)return {sp,sb,v};return null}
function wants(){const out=[];for(const sp of D.spheres)for(const sb of sp.subs)for(const v of sb.v){const r=S.ans[v.id];if(r&&(r.a==="want"||r.a==="keep"))out.push({sp,sb,v,a:r.a})}return out}
function short(t){t=String(t).trim();let s=t;const c=t.indexOf(":");
  if(c>10&&c<95)s=t.slice(0,c);else{const m=t.slice(20).search(/,\s|\s—\s/);if(m>=0&&m+20<90)s=t.slice(0,m+20)}
  s=s.replace(/[.,\s]+$/,"");return s.length>80?s.slice(0,77).replace(/\s+\S*$/,"")+"…":s}
function labItems(){
  const L=S.lab, gone=new Set(), its=[];
  for(const k in L.clouds){const c=L.clouds[k];if(c&&c.rep&&c.idea&&c.idea.trim())k.split("~").forEach(x=>gone.add(x))}
  for(const id of L.picks){if(gone.has(id))continue;const c=card(id);if(c)its.push({id,title:vtitle(c.v),w:c.v.w,sp:c.sp.id})}

function valCounts(){const c={};for(const id of S.lab.picks){for(const v of (S.lab.vals[id]||[]))c[v]=(c[v]||0)+1;const o=(S.lab.vown[id]||"").trim().toLowerCase();if(o)c["~"+o]=(c["~"+o]||0)+1}return c}

function findClouds(){
  const P=S.lab.picks, out=[];
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j],ca=card(a),cb=card(b);if(!ca||!cb||ca.v.w===cb.v.w)continue;
    const va=S.lab.vals[a]||[],vb=S.lab.vals[b]||[];let vt=null;
    for(const [x,y] of TENS){if(va.includes(x)&&vb.includes(y)){vt=[x,y];break}if(va.includes(y)&&vb.includes(x)){vt=[y,x];break}}
    const score=(DIAG[ca.v.w]===cb.v.w?2:1)+(vt?2:0)+(ca.sp.id!==cb.sp.id?0.5:0);
    out.push({a,b,key:a+"~"+b,w:[ca.v.w,cb.v.w].sort().join("|"),vt,score});
  }
  out.sort((p,q)=>q.score-p.score);
  const used={},res=[];for(const c of out){if((used[c.a]||0)>=2||(used[c.b]||0)>=2)continue;res.push(c);used[c.a]=(used[c.a]||0)+1;used[c.b]=(used[c.b]||0)+1;if(res.length>=3)break}
  return res;
}

function rLab(){
  const el=document.getElementById("s-lab"), Lb=S.lab, W=wants();
  Lb.picks=Lb.picks.filter(id=>W.some(x=>x.v.id===id));
  if(Lb.first&&!Lb.picks.includes(Lb.first.want))Lb.first=null;
  const head=`<h1>${T.lb.h}</h1><div class="holo"></div><div class="steps">${T.lb.steps.map((s,i)=>`<span class="${i===Lb.step?"on":i<Lb.step?"done":""}">${i+1}. ${s}</span>`).join("")}</div>`;
  if(!W.length){el.innerHTML=head+`<p>${T.lb.empty}</p><a class="btn" href="#start">${T.go}</a>`;return}
  const pSph=new Set(Lb.picks.map(id=>card(id).sp.id));
  if(Lb.step>0&&!Lb.picks.length)Lb.step=0;
  const nav=(canNext,last)=>`<div class="row noprint" style="margin-top:18px">${Lb.step?`<button class="btn ghost" id="lb">${T.lb.back}</button>`:""}${last?`<a class="btn" href="#result">${T.lb.toRes}</a>`:`<button class="btn" id="ln" ${canNext?"":"disabled"}>${T.lb.next}</button>`}</div>`;
  let body="";
  if(Lb.step===0){
    body=`<p>${T.lb.intro}</p><h2>${T.lb.pickH}</h2><p class="muted">${T.lb.pickN(Lb.picks.length,pSph.size)}.</p>`+
      W.map(x=>{const on=Lb.picks.includes(x.v.id);return `<button class="pick" data-id="${x.v.id}" aria-pressed="${on}" ${!on&&Lb.picks.length>=10?"disabled":""}><span class="box">${on?"✓":""}</span><span>${esc(vtitle(x.v))}<small>${esc(nm(x.sp))} · ${esc(nm(x.sb))} · ${T.worlds[x.v.w]}</small></span></button>`}).join("")+nav(Lb.picks.length>0);
  }else if(Lb.step===1){
    const vc=valCounts(), ks=Object.keys(vc).sort((a,b)=>vc[b]-vc[a]), mx=Math.max(1,...Object.values(vc));
    body=`<h2>${T.lb.whyH}</h2><p>${T.lb.whyP}</p>`+Lb.picks.map(id=>{const c=card(id),sel=Lb.vals[id]||[];return `<div class="item" style="border-left-color:${WC[c.v.w]}"><p class="t">${esc(vtitle(c.v))}</p><div class="tags">${Object.keys(T.vals).map(k=>`<button class="tg" data-id="${id}" data-v="${k}" aria-pressed="${sel.includes(k)}" ${!sel.includes(k)&&sel.length>=3?"disabled":""}>${T.vals[k]}</button>`).join("")}</div><input type="text" data-own="${id}" value="${esc(Lb.vown[id]||"")}" placeholder="${T.lb.ownPh}"></div>`}).join("")+
      `<div class="sumbox"><p class="big">${ks.length?esc(T.lb.valsSum(joinList(ks.slice(0,3).map(vLabel)))):T.lb.valsNone}</p>${ks.map(k=>`<div class="vbar"><span>${esc(vLabel(k))}</span><span class="b"><i style="width:${vc[k]/mx*100}%;background:var(--ink)"></i></span><span>${vc[k]}</span></div>`).join("")}</div>`+nav(true);
  }else if(Lb.step===2){
    const cl=findClouds();
    if(cl.length){
      body=`<h2>${T.lb.cloudH}</h2><p>${T.lb.cloudP}</p>`+cl.map(c=>{const A=card(c.a),B=card(c.b),st=Lb.clouds[c.key]||{};
        return `<div class="item"><div class="pair"><div class="s" style="border-left:5px solid ${WC[A.v.w]}">${esc(vtitle(A.v))}</div><div class="z">⚡</div><div class="s" style="border-left:5px solid ${WC[B.v.w]}">${esc(vtitle(B.v))}</div></div><p class="why"><b>${esc(T.lb.cloudW[c.w])}</b>${c.vt?" "+esc(T.lb.cloudVal(T.vals[c.vt[0]],T.vals[c.vt[1]])):""}</p><textarea rows="2" data-cloud="${c.key}" placeholder="${T.lb.ideaPh}">${esc(st.idea||"")}</textarea><label class="muted" style="font-size:14px;display:block;margin-top:6px"><input type="checkbox" data-rep="${c.key}" ${st.rep?"checked":""}> ${T.lb.replace}</label></div>`}).join("");
    }else{
      const w=card(Lb.picks[0]).v.w, vc=valCounts(), ks=Object.keys(vc).sort((a,b)=>vc[b]-vc[a]).slice(0,2).map(vLabel);
      const st=Lb.clouds["one"]||{};
      body=`<h2>${T.lb.cloudH}</h2><div class="item" style="border-left-color:${WC[w]}"><p class="t">${esc(T.lb.oneWorld(T.worlds[w].toLowerCase(),joinList(ks)))}</p><p class="why"><b>${esc(T.lb.oneWorldQ(T.wTxt[w][1].replace(/^./,c=>c.toLowerCase())))}</b></p><textarea rows="2" data-cloud="one" placeholder="${T.lb.payPh}">${esc(st.idea||"")}</textarea></div>`;
    }
    body+=nav(true);
  }else if(Lb.step===3){
    body=`<h2>${T.lb.defH}</h2><p>${T.lb.defP}</p><div class="tags" style="gap:10px">${Object.keys(T.res).map(k=>`<button class="tg big" data-def="${k}" aria-pressed="${Lb.def===k}">${T.res[k]}</button>`).join("")}<button class="tg big" data-def="" aria-pressed="${Lb.def===""}">${T.lb.defNone}</button></div>`+nav(Lb.def!==null);
  }else{
    const Lv=lever(), def=Lb.def;
    const levTxt=Lv.k?T.lb.levT(vLabel(Lv.k),Lv.n,Lv.m):T.lb.levNone;
    body=`<h2>${T.lb.levH}</h2><div class="sumbox"><p class="big">${esc(levTxt)}</p></div>`+
      Lv.ids.map(id=>{const c=card(id);return `<h3 style="margin-top:22px">${esc(T.lb.waysH(short(vtitle(c.v))))}</h3><p class="muted" style="font-size:14px">${esc(T.lb.waysP(def?T.res[def]:""))}</p>`+waysFor(id).map(x=>wayHTML(id,x)).join("")}).join("");
    const f=Lb.first, fc=f&&card(f.card);
    if(fc){
      const gk=Object.keys(Lb.gain||{}).filter(k=>Lb.gain[k]), gl=joinList(gk.map(k=>T.res[k]));
      const ok=!!(def&&gk.includes(def));
      const loopTxt=!gk.length?"":ok?T.lb.loopOk(T.res[def]):def?T.lb.loopNo(gl,T.res[def]):T.lb.loopAny(gl);
      body+=`<h2 style="margin-top:26px">${T.lb.gainH}</h2><p class="muted">${T.lb.gainP}</p><div class="tags">${Object.keys(T.res).map(k=>`<button class="tg${Lb.gain[k]?" have":""}" data-gain="${k}" aria-pressed="${!!Lb.gain[k]}">${Lb.gain[k]?"+ ":""}${T.res[k]}</button>`).join("")}</div>`+
        (gk.length?loopSVG(short(stepText(fc.v)),gl,Lv.k?vLabel(Lv.k):short(vtitle(card(f.want).v)),ok)+`<p class="big" style="${ok?"":"color:#c2410c"}">${esc(loopTxt)}</p>`:"")+
        (gk.length&&def&&!ok?`<div class="sumbox"><h3 style="margin-top:0">${T.lb.thinkH}</h3>${T.lb.think.map(([q,e])=>`<p><b>${esc(q)}</b><br><span class="muted">${T.lb.eg} ${esc(e)}</span></p>`).join("")}</div>`:"");
      const cnt={};for(const x of W)cnt[x.sp.id]=(cnt[x.sp.id]||0)+1;const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0],tsp=D.spheres.find(s=>s.id===top);
      body+=`<div class="sumbox" style="margin-top:22px"><h3 style="margin-top:0">${T.lb.picH}</h3><p>${esc(T.lb.picMost(nm(tsp),cnt[top]))}</p>${Lv.k?`<p>${esc(levTxt)}</p>`:""}${def?`<p>${esc(T.lb.picDef(T.res[def]))}</p>`:""}<p><b>${esc(T.lb.picStep(stepText(fc.v)))}</b></p>${gk.length?`<p>${esc(loopTxt)}</p>`:""}<p class="big">${T.lb.picQ}</p></div>`;
    }
    body+=`<div class="labbox"><h2>${T.lb.finH}</h2><p>${T.lb.finP}</p><a class="btn" href="${LAB}">${T.labBtn}</a></div>`+nav(true,true);
  }
  el.innerHTML=head+body;
  const q=s=>el.querySelectorAll(s);
  q(".pick").forEach(b=>b.onclick=()=>{const id=b.dataset.id;Lb.picks=Lb.picks.includes(id)?Lb.picks.filter(x=>x!==id):Lb.picks.length<10?[...Lb.picks,id]:Lb.picks;save();rLab()});
  q(".tg[data-v]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,v=b.dataset.v,a=Lb.vals[id]||[];Lb.vals[id]=a.includes(v)?a.filter(x=>x!==v):a.length<3?[...a,v]:a;save();rLab()});
  q("input[data-own]").forEach(i=>i.onchange=()=>{Lb.vown[i.dataset.own]=i.value;save();rLab()});
  q("textarea[data-cloud]").forEach(t=>t.oninput=()=>{const k=t.dataset.cloud;Lb.clouds[k]=Object.assign(Lb.clouds[k]||{},{idea:t.value});save()});
  q("input[data-rep]").forEach(c=>c.onchange=()=>{const k=c.dataset.rep;Lb.clouds[k]=Object.assign(Lb.clouds[k]||{},{rep:c.checked});save()});
  q(".tg[data-def]").forEach(b=>b.onclick=()=>{Lb.def=b.dataset.def;save();rLab()});
  q("button[data-take]").forEach(b=>b.onclick=()=>{const [want,c]=b.dataset.take.split("|");Lb.first=(Lb.first&&Lb.first.card===c&&Lb.first.want===want)?null:{want,card:c};Lb.gain={};save();rLab()});
  q(".tg[data-gain]").forEach(b=>b.onclick=()=>{const k=b.dataset.gain;Lb.gain=Lb.gain||{};if(Lb.gain[k])delete Lb.gain[k];else Lb.gain[k]=true;save();rLab()});
  const ln=el.querySelector("#ln");if(ln)ln.onclick=()=>{Lb.step=Math.min(4,Lb.step+1);save();rLab();window.scrollTo(0,0)};
  const lb=el.querySelector("#lb");if(lb)lb.onclick=()=>{Lb.step=Math.max(0,Lb.step-1);save();rLab();window.scrollTo(0,0)};
}
function labMD(){
  const Lb=S.lab;if(!Lb.picks.length)return "";
  const vc=valCounts(),ks=Object.keys(vc).sort((a,b)=>vc[b]-vc[a]);
  let s=`\n## ${T.mdLab}\n\n### ${T.mdVals}\n`;
  for(const id of Lb.picks){const c=card(id);if(!c)continue;const v=[...(Lb.vals[id]||[]).map(k=>T.vals[k]),...((Lb.vown[id]||"").trim()?[Lb.vown[id].trim()]:[])];s+=`- ${vtitle(c.v)}${v.length?" — "+v.join(", "):""}\n`}
  if(ks.length)s+=`\n${T.lb.valsSum(joinList(ks.slice(0,3).map(vLabel)))}\n`;
  const ids=Object.keys(Lb.clouds).filter(k=>Lb.clouds[k].idea&&Lb.clouds[k].idea.trim());
  if(ids.length){s+=`\n### ${T.mdClouds}\n`;for(const k of ids){if(k==="one"){s+=`- ${T.lb.idea}: ${Lb.clouds[k].idea.trim()}\n`;continue}const [a,b]=k.split("~"),A=card(a),B=card(b);if(A&&B)s+=`- ${vtitle(A.v)} ⚡ ${vtitle(B.v)}\n  - ${T.lb.idea}: ${Lb.clouds[k].idea.trim()}\n`}}
  const Lv=lever(),f=Lb.first,fc=f&&card(f.card);
  if(Lv.k||Lb.def||fc){
    s+=`\n### ${T.mdRes}\n`;
    if(Lv.k)s+=`- ${T.lb.levH}: ${T.lb.levT(vLabel(Lv.k),Lv.n,Lv.m)}\n`;
    if(Lb.def)s+=`- ${T.lb.picDef(T.res[Lb.def])}\n`;
    if(fc){const v=fc.v,src=v.st_ru?(LANG==="en"?(v.st_src_en||v.st_src):v.st_src):"";
      s+=`- ${T.lb.picStep(stepText(v))} (${T.worlds[v.w]})\n`;
      if(v.st_ru)s+=`  - ${T.lb.how} ${L(v,"hw")} ${src}\n`;
      const gk=Object.keys(Lb.gain||{}).filter(k=>Lb.gain[k]);
      if(gk.length){const gl=joinList(gk.map(k=>T.res[k]));s+=`  - ${Lb.def&&gk.includes(Lb.def)?T.lb.loopOk(T.res[Lb.def]):Lb.def?T.lb.loopNo(gl,T.res[Lb.def]):T.lb.loopAny(gl)}\n`;
        if(Lb.def&&!gk.includes(Lb.def)){s+=`\n${T.lb.thinkH}\n`;for(const [qq,e] of T.lb.think)s+=`- ${qq} (${T.lb.eg} ${e})\n`}}
    }
  }
  return s;
}

load();
fetch(DATA_URL).then(r=>r.json()).then(d=>{D=d;
  S.sel=S.sel.filter(id=>D.spheres.some(s=>s.id===id));
  window.addEventListener("hashchange",route);route();
}).catch(()=>{document.getElementById("s-start").hidden=false;document.getElementById("s-start").textContent=T.loadErr});
</script>
</body>
