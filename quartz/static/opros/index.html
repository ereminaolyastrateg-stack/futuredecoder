   ex:["We start outside: in the questionnaire you marked what you like in the worlds of the future. Keep the main things you want to work with.",
       "Now honestly: how things are. Much is already here from the questionnaire — check it and add your own. For each thing: what it's for, whether it helps or hurts, and how hard it is to change.",
       "Two ordinary days are drafted from “now” and “want”. Read day B, then live it: three minutes with your eyes closed. Afterwards write what it turned out to be, and keep only the wants you truly want — next to a real day, some turn out not to be yours.",
       "A want is a means; a value stands behind it. Mark what each want is for, and where it comes from: seen yourself, heard, remembered from family.",
       "Values form clusters: many wants serve some, one serves others. Choose one or two to start with, and see how others get them.",
       "A want closes the search; a question opens it. Write questions: how to get the value through the way you want, and what you don't want to pay with. The ways are your wants with that value, or your own option. Each question is a storm cloud. We'll untangle up to three.",
       "A cloud rests on a hidden “because…”. If that isn't true, the cloud evaporates. Answer yourself first: why it seems impossible, what if that isn't true, what your lever is and what the minimal step is. Then look at our options. Send whatever resonates to the lever field.",
       "Everything you found across all clouds is here. Sort it into levels yourself: action — do one thing; rule or habit — what you now always do; change of picture — what you stopped believing. Then choose the lever you'll take further.",
       "A lever doesn't live in a vacuum: it lands in some sphere, strengthens something and touches something else. Mark both the pluses and the minuses honestly — otherwise the picture is made only of good things. Then — how you'll put it into practice.",
       "A lever is an experiment. What should you see if it works? What will your point A become? When will you check? You can add another lever and go through this again.",
       "The whole picture on one screen: where you are, which clouds you untangled, which levers you found, the step you're taking, what point A becomes and what feedback you expect on the way to B. And a promise for the week."],

function queue(){const q=[];for(const sp of D.spheres)if(S.sel.includes(sp.id))for(const sb of sp.subs)q.push({sp,sb});return q}
function order(sb){
  if(!S.order[sb.id]){const a=sb.v.map(v=>v.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.order[sb.id]=a}
  return S.order[sb.id].map(id=>sb.v.find(v=>v.id===id)).filter(Boolean);
}

function show(name){
  for(const n of ["start","run","result","lab"])document.getElementById("s-"+n).hidden=n!==name;

function fieldsFor(v,a){

  if(a==="drop")return ta("why",T.f_dropwhy);

  return "";
}

    <details class="more"><summary>${T.more}</summary><p><b>${T.plus}</b> ${esc(L(v,"p"))}</p><p><b>${T.minus}</b> ${esc(L(v,"m"))}</p>${ex?`<p><b>${T.ex}</b></p>${ex}`:""}</details>

function collect(){
  const out=[];
  for(const sp of D.spheres){
    const subs=[];
    for(const sb of sp.subs){
      const items=sb.v.filter(v=>S.ans[v.id]).map(v=>({v,r:S.ans[v.id]}));
      if(items.length||S.own[sb.id])subs.push({sb,items,own:S.own[sb.id]||""});
    }
    if(subs.length)out.push({sp,subs});
  }
  return out;
}
function worldCounts(){
  const now={},fut={};for(const k in T.worlds){now[k]=0;fut[k]=0}
  for(const sp of D.spheres)for(const sb of sp.subs)for(const v of sb.v){const r=S.ans[v.id];if(!r)continue;
    if(r.a==="keep"||r.a==="drop")now[v.w]++;if(r.a==="keep"||r.a==="want")fut[v.w]++}
  return {now,fut};
}
function conclusion(){
  const {now,fut}=worldCounts(), ks=Object.keys(T.worlds);
  const top=o=>{const m=Math.max(...ks.map(k=>o[k]));return m?ks.filter(k=>o[k]===m):[]};
  const nm2=a=>a.map(k=>T.wPrep[k]).join(T.vAnd), gn2=a=>a.map(k=>T.wGen[k]).join(T.vAnd);
  const tn=top(now), tf=top(fut);
  let v="";
  if(!tn.length&&tf.length)v=T.vOnlyFut(gn2(tf));
  else if(tn.length&&tf.length&&tn.join()===tf.join())v=T.vSame(nm2(tn));
  else if(tn.length&&tf.length)v=T.vShift(nm2(tn),nm2(tf));
  const gains=ks.map(k=>fut[k]-now[k]), g=Math.max(...gains);
  if(v&&g>0&&tn.length){const gk=ks.filter((k,i)=>gains[i]===g&&!tf.includes(k));if(gk.length)v+=T.vGrow(gn2(gk))}
  const shown=ks.filter(k=>now[k]||fut[k]).sort((a,b)=>(fut[b]-now[b])-(fut[a]-now[a])||fut[b]-fut[a]);
  return {now,fut,v,shown};
}

function labMD(){
  const Lb=S.lab,X=T.lb2,Y=X.v4;if(!Lb.picks.length)return "";
  const li=(t,v)=>(v||"").trim()?`- ${t} ${String(v).trim()}\n`:"";
  let s=`\n## ${T.mdLab}\n`;
  if((Lb.sit||[]).length||(Lb.ownWant||"").trim())s+=`\n### ${Y.steps[0]}\n`+((Lb.sit||[]).length?`- ${Y.sitQ} ${Lb.sit.map(k=>Y.sit[k]).join(", ")}\n`:"")+li(Y.ownWantQ,Lb.ownWant);
  const nt=nowText();if(nt.length||(Lb.kwA||"").trim()){s+=`\n### ${Y.steps[1]}\n`;for(const t of nt)s+=`- ${t}\n`;s+=li(X.realH,Lb.kwA)}
  if((Lb.dayB||"").trim()||(Lb.dayB2||"").trim())s+=`\n### ${Y.steps[2]}\n`+li(X.dayB+":",Lb.dayB)+li(X.dayB2H+":",Lb.dayB2);
  s+=`\n### ${Y.steps[3]}\n`;
  for(const id of Lb.picks){const c=card(id);if(!c)continue;const v=wvals(id);s+=`- ${vtitle(c.v)}${v.length?" — "+v.join(", "):""}\n`}
  for(const x of ownT(Lb.bOwn,X.bTpl))s+=`- ${x}\n`;
  if((Lb.notMine||[]).length)s+=`- ${X.nmH}: ${Lb.notMine.map(id=>card(id)?vtitle(card(id).v):"").filter(Boolean).join("; ")}\n`;
  if((Lb.levs||[]).length)s+=`- ${X.startH}: ${Lb.levs.map(vLabel).join(", ")}\n`;
  const bl=(Lb.bel||[]).filter(b=>(b.text||"").trim()),cl=(Lb.cl2||[]).filter(c=>(c.a||"").trim()||(c.b||"").trim());
  if(bl.length||cl.length){s+=`\n### ${Y.steps[4]}\n`;
    for(const b of bl){s+=`- ${b.st==="false"?"✗ ":b.st==="true"?"● ":""}${b.text.trim()}\n`;if(b.src)s+=`  - ${Y.belSrc} ${Y.belSrcO[b.src]}\n`;for(const [f,lab] of [["why",Y.belWhy],["ifnot",Y.belIf]])if((b[f]||"").trim())s+=`  - ${lab} ${b[f].trim()}\n`}
    for(const c of cl){s+=`- ${Y.clH}: ${(c.a||"").trim()} ↔ ${(c.b||"").trim()}\n`;for(const [f,lab] of [["na",Y.clNA],["nb",Y.clNB],["goal",Y.clGoal],["why",Y.clWhy],["ifnot",Y.belIf]])if((c[f]||"").trim())s+=`  - ${lab}: ${c[f].trim()}\n`}}
  const fi=fieldItems();if(fi.length){s+=`\n### ${Y.steps[5]}\n`;for(const l of ["act","rule","pic",""]){const xs=fi.filter(o=>o.lvl===l);if(xs.length){s+=`- ${X.lvl[l]||X.lvlNone}:\n`;for(const o of xs){const n=(Lb.cover[o.key]||[]).length;s+=`  - ${(Lb.first&&Lb.first.key===o.key)||(Lb.extra||[]).some(x=>x.key===o.key)?"★ ":(Lb.fin||[]).includes(o.key)?"☆ ":""}${o.title}${n?` (${Y.coverN(n)})`:""}\n`}}}}
  const lev1=(title,exp,fb,k)=>{let r=`\n### ${X.chosenL}: ${title}\n`;if(k){const [p,m]=score(k);r+=`- +${p} / −${m}\n`}
    const st_=(exp.when||"").trim()&&(exp.do||"").trim()?`${Y.stepWhen} ${exp.when.trim()}, ${Y.stepDo} ${exp.do.trim()}`:(exp.do||"");
    r+=li(Y.stepH+":",st_)+li(X.fbSee+":",fb.see)+li(Y.fbHow+":",fb.how)+li(Y.fbFreq+":",fb.freq)+li(X.fbExpA+":",fb.expA)+li(X.fbDate+":",fb.date);return r};
  for(const x of (Lb.extra||[]))s+=lev1(x.title,x.exp||{},x.fb||{});
  if(Lb.first){s+=lev1(firstTitle(),Lb.exp,Lb.fb,Lb.first.key);
    for(const [k,qq] of X.com)if(Lb.com[k])s+=`- ${qq} ${X.comA[Lb.com[k]]}${((Lb.comT||{})[k]||"").trim()?" — "+Lb.comT[k].trim():""}\n`;
    s+=li(Y.preQ,(Lb.emb||{}).hinder);
    for(const [k,qq] of X.loopQ)s+=li(qq,(Lb.loop||{})[k]);
    const who=Lb.who||{};X.whoPh.forEach((p,i)=>{const w=who[i]||{};if((w.lv!==undefined&&w.lv!=="")||(w.names||"").trim())s+=`- ${X.whoH} (${p}): ${w.lv!==undefined&&w.lv!==""?X.whoLv[+w.lv]:""}${(w.names||"").trim()?" — "+w.names.trim():""}\n`});
    s+=li(Y.whoTalk+":",who.talk)}
  const th=Lb.thing||{};if((th.brought||"").trim()||(th.remind||"").trim())s+=`\n### ${X.mdThing}\n_${X.thNote}_\n`+li(X.th[0][1],th.brought)+li(Y.thingQ,th.remind);
  if(Lb.deep){const J=T.lb.jokers[Lb.jk];if(J)s+=`\n### ${Y.steps2[0]}\n- ${J[1]}${(Lb.jkA||"").trim()?" — "+Lb.jkA.trim():""}\n`;
    const rv=Lb.rev||{};if(rv.layer||Object.values(rv).some(x=>(x||"").trim())){s+=`\n### ${X.revH}\n`;if(rv.layer)s+=`- ${X.revLayer} ${X.layers[rv.layer]}\n`;for(const [k,t] of X.revEv)s+=li(t+":",rv[k]);s+=li(X.revAct,rv.act)+li(X.revSucc,rv.succ)}}
  if(Lb.cycles&&Lb.cycles.length){s+=`\n### ${T.lb.cycDone}\n`;Lb.cycles.forEach((c,i)=>{s+=`- ${T.lb.cycN(i+1)} (${c.date}): ${c.step}${c.changed?` → ${c.changed}`:""}\n`})}
  return s;
}

function ownIds(){const nm_=S.lab.notMine||[];return (S.lab.ownW||[]).filter(o=>(o.t||"").trim()&&!nm_.includes("o:"+o.id)).map(o=>"o:"+o.id)}

  ks.forEach((k,i)=>{const on=sel.includes(k);n+=`<rect x="${lx}" y="${ly(i)}" width="${lw}" height="36" rx="18" fill="${on?"#7048e8":"#fff"}" stroke="${on?"#7048e8":"#adb5bd"}" stroke-width="1.5"/><text x="${lx+lw/2}" y="${ly(i)+23}" text-anchor="middle" font-size="13.5" font-weight="600" fill="${on?"#fff":"#111"}">${esc(vLabel(k))} · ${vc[k]}</text>`});

function labMD(){
  const Lb=S.lab,X=T.lb2,Y=X.v4,Z=X.v5,Q=X.v6;if(!allW().length&&!nowText().length)return "";
  const li=(t,v)=>(v||"").trim()?`- ${t} ${String(v).trim()}\n`:"";
  let s=`\n## ${T.mdLab}\n`;
  if((Lb.sit||[]).length)s+=`\n- ${Y.sitQ} ${Lb.sit.map(k=>Y.sit[k]).join(", ")}\n`;
  const nt=nowText();if(nt.length){s+=`\n### ${Q.steps[0]}\n`;for(const t of nt)s+=`- ${t}\n`}
  const kd=allNow().filter(x=>x.a);for(const x of kd)s+=`- ${x.a==="keep"?Q.gKeep:Q.gDrop}: ${x.label}\n`;
  s+=`\n### ${Q.steps[1]}\n`;
  for(const id of allW()){const v=wvals(id),sr=((Lb.srcs||{})[id]||[]).map(k=>X.src[k]),sp=D.spheres.find(x=>x.id===wSphere(id));s+=`- ${sp?nm(sp)+": ":""}${id.startsWith("o:")?wName(id):vtitle(card(id).v)}${v.length?" — "+v.join(", "):""}${sr.length?` (${sr.join(", ")})`:""}\n`;if(((Lb.forg||{})[id]||"").trim())s+=`  - ${X.forgWay}: ${Lb.forg[id].trim()}\n`}
  if((Lb.notMine||[]).length)s+=`- ${X.nmH}: ${Lb.notMine.map(wName).filter(Boolean).join("; ")}\n`;
  if((Lb.dayB||"").trim()||(Lb.dayB2||"").trim())s+=`\n### ${Q.steps[2]}\n`+li(X.dayB+":",Lb.dayB)+li(X.dayB2H+":",Lb.dayB2);
  if((Lb.levs||[]).length)s+=`- ${X.startH}: ${Lb.levs.map(vLabel).join(", ")}\n`;
  const bl=(Lb.bel||[]).filter(b=>(b.text||"").trim()),cl=(Lb.cl2||[]).filter(c=>(c.a||"").trim()||(c.b||"").trim());
  s+=`\n### ${Q.steps[3]}\n`;
  for(const b of bl){s+=`- ${b.st==="false"?"✗ ":b.st==="true"?"● ":""}${b.text.trim()}\n`;if(b.src)s+=`  - ${Y.belSrc} ${Y.belSrcO[b.src]}\n`;for(const [f,lab] of [["why",Y.belWhy],["ifnot",Y.belIf]])if((b[f]||"").trim())s+=`  - ${lab} ${b[f].trim()}\n`}
  for(const c of cl){s+=`- ${Y.clH}: ${(c.a||"").trim()} ↔ ${(c.b||"").trim()}\n`;for(const [f,lab] of [["na",Y.clNA],["nb",Y.clNB],["goal",Y.clGoal],["why",Y.clWhy],["ifnot",Y.belIf]])if((c[f]||"").trim())s+=`  - ${lab}: ${c[f].trim()}\n`}
  for(const o of Lb.bright)if((o.t||"").trim())s+=`- ${Z.brightH}: ${o.t.trim()}\n`;
  const fi=fieldItems();if(fi.length){s+=`\n### ${Z.myLevH}\n`;for(const l of ["act","rule","pic",""]){const xs=fi.filter(o=>o.lvl===l);if(xs.length){s+=`- ${X.lvl[l]||Q.levNoLvl}:\n`;for(const o of xs)s+=`  - ${(Lb.first&&Lb.first.key===o.key)||(Lb.extra||[]).some(x=>x.key===o.key)?"★ ":(Lb.fin||[]).includes(o.key)?"☆ ":""}${o.title}\n`}}}
  if((Lb.fin||[]).length){s+=`\n### ${Q.sysH}\n`;for(const k of Lb.fin){const [p,m]=score(k);s+=`- ${wayObj(k).title} (+${p} / −${m})\n`;for(const ek in (Lb.link[k]||{}))s+=`  - ${Lb.link[k][ek]==="+"?"+":"−"} ${itemLabel(ek)}\n`}}
  const lev1=(title,exp,fb)=>{let r=`\n### ${X.chosenL}: ${title}\n`;const st_=(exp.when||"").trim()&&(exp.do||"").trim()?`${Y.stepWhen} ${exp.when.trim()}, ${Y.stepDo} ${exp.do.trim()}`:(exp.do||"");
    r+=li(Y.stepH+":",st_)+li(X.fbSee+":",fb.see)+li(Y.fbHow+":",fb.how)+li(Y.fbFreq+":",fb.freq)+li(X.fbExpA+":",fb.expA)+li(X.fbDate+":",fb.date);return r};
  for(const x of (Lb.extra||[]))s+=lev1(x.title,x.exp||{},x.fb||{});
  if(Lb.first){s+=lev1(firstTitle(),Lb.exp,Lb.fb);
    s+=li(Z.loopR+":",Lb.loop.r)+li(Z.loopB+":",Lb.loop.b)+li(Z.loopD+":",Lb.loop.delay);
    for(const [k,qq] of X.com)if(Lb.com[k])s+=`- ${qq} ${X.comA[Lb.com[k]]}${((Lb.comT||{})[k]||"").trim()?" — "+Lb.comT[k].trim():""}\n`;
    s+=li(Y.preQ,(Lb.emb||{}).hinder);
    const who=Lb.who||{};X.whoPh.forEach((p,i)=>{const w=who[i]||{};if((w.lv!==undefined&&w.lv!=="")||(w.names||"").trim())s+=`- ${X.whoH} (${p}): ${w.lv!==undefined&&w.lv!==""?X.whoLv[+w.lv]:""}${(w.names||"").trim()?" — "+w.names.trim():""}\n`});
    s+=li(Y.whoTalk+":",who.talk)}
  const th=Lb.thing||{};if((th.brought||"").trim()||(th.remind||"").trim())s+=`\n### ${X.mdThing}\n_${X.thNote}_\n`+li(X.th[0][1],th.brought)+li(Y.thingQ,th.remind);
  if(Lb.deep){const J=T.lb.jokers[Lb.jk];if(J)s+=`\n### ${Z.steps2[0]}\n- ${J[1]}${(Lb.jkA||"").trim()?" — "+Lb.jkA.trim():""}\n`;
    const rv=Lb.rev||{};if(rv.layer||Object.values(rv).some(x=>(x||"").trim())){s+=`\n### ${X.revH}\n`;if(rv.layer)s+=`- ${X.revLayer} ${X.layers[rv.layer]}\n`;for(const [k,t] of X.revEv)s+=li(t+":",rv[k]);s+=li(X.revAct,rv.act)+li(X.revSucc,rv.succ)}}
  if(Lb.cycles&&Lb.cycles.length){s+=`\n### ${T.lb.cycDone}\n`;Lb.cycles.forEach((c,i)=>{s+=`- ${T.lb.cycN(i+1)} (${c.date}): ${c.step}${c.changed?` → ${c.changed}`:""}\n`})}
  return s;
}
