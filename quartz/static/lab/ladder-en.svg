<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#212529"/></marker></defs><rect width="960" height="700" fill="#fbfaf7"/><line x1="70" y1="40" x2="70" y2="600" stroke="#212529" stroke-width="5" stroke-linecap="round"/><line x1="130" y1="40" x2="130" y2="600" stroke="#212529" stroke-width="5" stroke-linecap="round"/><text x="100" y="26" text-anchor="middle" font-size="13" fill="#868e96">abstract</text><text x="100" y="626" text-anchor="middle" font-size="13" fill="#868e96">concrete</text><text transform="translate(34,330) rotate(-90)" text-anchor="middle" font-size="14" fill="#495057">↓ we go down from a world to a step</text><line x1="70" y1="70" x2="130" y2="70" stroke="#7048e8" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="70" x2="170" y2="70" stroke="#7048e8" stroke-width="2" stroke-dasharray="4 4"/><rect x="170" y="26.0" width="560" height="88" rx="16" fill="#fff" stroke="#7048e8" stroke-width="2"/><rect x="170" y="26.0" width="8" height="88" rx="4" fill="#7048e8"/><text x="194" y="54" font-size="18" font-weight="700" fill="#212529">Start<tspan font-weight="400" fill="#868e96" font-size="14">  ·  3 January</tspan></text><text x="710" y="54" text-anchor="end" font-size="13" font-weight="700" fill="#7048e8">WORLDS · Setting</text><text x="194" y="80" font-size="15" fill="#343a40">Talk: eight spheres and four logics of the future</text><line x1="70" y1="182" x2="130" y2="182" stroke="#1c7ed6" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="182" x2="170" y2="182" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="4 4"/><rect x="170" y="138.0" width="560" height="88" rx="16" fill="#fff" stroke="#1c7ed6" stroke-width="2"/><rect x="170" y="138.0" width="8" height="88" rx="4" fill="#1c7ed6"/><text x="194" y="166" font-size="18" font-weight="700" fill="#212529">1. Look<tspan font-weight="400" fill="#868e96" font-size="14">  ·  on your own, online</tspan></text><text x="710" y="166" text-anchor="end" font-size="13" font-weight="700" fill="#1c7ed6">MY LIFE · Scenario</text><text x="194" y="192" font-size="15" fill="#343a40">How things are now and what I want in each sphere — and what</text><text x="194" y="212" font-size="15" fill="#343a40">for</text><line x1="70" y1="294" x2="130" y2="294" stroke="#0ca678" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="294" x2="170" y2="294" stroke="#0ca678" stroke-width="2" stroke-dasharray="4 4"/><rect x="170" y="250.0" width="560" height="88" rx="16" fill="#fff" stroke="#0ca678" stroke-width="2"/><rect x="170" y="250.0" width="8" height="88" rx="4" fill="#0ca678"/><text x="194" y="278" font-size="18" font-weight="700" fill="#212529">2. Expand<tspan font-weight="400" fill="#868e96" font-size="14">  ·  10 January</tspan></text><text x="710" y="278" text-anchor="end" font-size="13" font-weight="700" fill="#0ca678">ONE DAY · Situation</text><text x="194" y="304" font-size="15" fill="#343a40">Other options from the four worlds and Day B in the life you</text><text x="194" y="324" font-size="15" fill="#343a40">want</text><line x1="70" y1="406" x2="130" y2="406" stroke="#f59f00" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="406" x2="170" y2="406" stroke="#f59f00" stroke-width="2" stroke-dasharray="4 4"/><rect x="170" y="362.0" width="560" height="88" rx="16" fill="#fff" stroke="#f59f00" stroke-width="2"/><rect x="170" y="362.0" width="8" height="88" rx="4" fill="#f59f00"/><text x="194" y="390" font-size="18" font-weight="700" fill="#212529">3. Find<tspan font-weight="400" fill="#868e96" font-size="14">  ·  17 January</tspan></text><text x="710" y="390" text-anchor="end" font-size="13" font-weight="700" fill="#f59f00">CONTRADICTIONS</text><text x="194" y="416" font-size="15" fill="#343a40">Clouds and beliefs that hold you. The field of levers</text><line x1="70" y1="518" x2="130" y2="518" stroke="#e8590c" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="518" x2="170" y2="518" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 4"/><rect x="170" y="474.0" width="560" height="88" rx="16" fill="#fff" stroke="#e8590c" stroke-width="2"/><rect x="170" y="474.0" width="8" height="88" rx="4" fill="#e8590c"/><text x="194" y="502" font-size="18" font-weight="700" fill="#212529">4. Assemble<tspan font-weight="400" fill="#868e96" font-size="14">  ·  24 January</tspan></text><text x="710" y="502" text-anchor="end" font-size="13" font-weight="700" fill="#e8590c">FIRST STEP · Stuff</text><text x="194" y="528" font-size="15" fill="#343a40">System: what the lever changes. Experiment and a thing from</text><text x="194" y="548" font-size="15" fill="#343a40">the future</text><text x="450" y="600" text-anchor="middle" font-size="14" fill="#868e96" font-style="italic">2-week pause — an experiment in real life</text><rect x="170" y="616" width="560" height="56" rx="16" fill="#212529"/><text x="194" y="650" font-size="18" font-weight="700" fill="#fff">5. Check<tspan font-weight="400" fill="#ced4da" font-size="14">  ·  7 February  ·  What worked and the next circle</tspan></text><path d="M690,644 C760,644 780,600 780,500 L780,90" fill="none" stroke="#212529" stroke-width="3" marker-end="url(#ar)"/><text x="795" y="300" font-size="14" fill="#495057">and climb back up:</text><text x="795" y="320" font-size="14" fill="#495057">what the step</text><text x="795" y="340" font-size="14" fill="#495057">changes in the</text><text x="795" y="360" font-size="14" fill="#495057">whole life</text></svg>